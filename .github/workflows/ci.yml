name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Collect plugin files
        run: cp dist/main.js main.js
      - uses: actions/upload-artifact@v4
        with:
          name: lacuna-build
          path: |
            main.js
            manifest.json
            styles.css
          retention-days: 14
