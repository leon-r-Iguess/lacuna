name: Clean up releases after history rewrite

# One-off: after rewriting the history, the old releases still point to commits that are no
# longer on main. Delete them (with their tags) and publish the current version on the new history.
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-releases.yml]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Delete releases whose tag is not on main
        run: |
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            sha=$(git rev-list -n1 "refs/tags/$tag" 2>/dev/null || true)
            if [ -z "$sha" ] || ! git merge-base --is-ancestor "$sha" HEAD; then
              echo "Deleting release $tag ($sha)"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: Publish the current version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            cp dist/main.js main.js
            gh release create "$VERSION" main.js manifest.json styles.css --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
