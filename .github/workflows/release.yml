name: Release

# Creates a GitHub release (and its tag) whenever manifest.json on main carries a
# version that has no release yet. Bump the version with `npm version <x.y.z>` and push.
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.skip != 'true'
        run: npm ci
      - if: steps.exists.outputs.skip != 'true'
        run: npm test
      - if: steps.exists.outputs.skip != 'true'
        run: npm run build
      - name: Create release
        if: steps.exists.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/main.js main.js
          gh release create "${{ steps.version.outputs.version }}" main.js manifest.json styles.css \
            --target "${GITHUB_SHA}" --title "${{ steps.version.outputs.version }}" --generate-notes
